    post:
      tags:
        - Drafts
      summary: Convert draft to post
      operationId: convertDraftToPost
      description: Converts a draft into a published or draft post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    attributes:
                      type: object
                      properties:
                        publish:
                          type: boolean
                          default: false
                          description: Whether to publish immediately
      responses:
        '201':
          description: Draft converted to post successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
