openapi: 3.1.0
info:
  title: BaaS - Blog as a Service API
  version: v1
  description: |
    Backend API for an AI-powered blogging platform with multi-tenancy support.
    
    ## Authentication
    
    This API uses JWT Bearer tokens for authentication. To authenticate:
    1. Register a new account via `POST /api/v1/auth/register`
    2. Login via `POST /api/v1/auth/login` to receive access and refresh tokens
    3. Include the access token in the `Authorization` header: `Bearer <token>`
    4. When the access token expires (15 minutes), use `POST /api/v1/auth/refresh` to get a new one
    
    ## JSON:API Format
    
    All endpoints follow the [JSON:API v1.1](https://jsonapi.org/) specification.
    
    Request bodies should be structured as:
    ```json
    {
      "data": {
        "type": "resource_type",
        "attributes": { ... }
      }
    }
    ```
    
    ## Multi-Tenancy
    
    Resources are scoped to accounts. Users can belong to multiple accounts.
    The current account is determined by the JWT token.
    
    ## Rate Limiting
    
    API requests are rate limited. Check response headers for limit info.
  contact:
    name: BaaS Support
    email: support@baas.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.baas.example.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication and token management
  - name: Blogs
    description: Blog management endpoints
  - name: Posts
    description: Post management endpoints
  - name: Drafts
    description: Draft management endpoints
  - name: Tags
    description: Tag management endpoints
  - name: Categories
    description: Category management endpoints
  - name: API Keys
    description: API key management endpoints
  - name: Health
    description: Health check endpoints

security:
  - bearer_auth: []

paths:
  # ============================================
  # Health Endpoints
  # ============================================
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck
      security: []
      description: Returns the health status of the API. No authentication required.
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.0.0

  /api/v1/public:
    get:
      tags:
        - Health
      summary: Public endpoint
      operationId: publicEndpoint
      security: []
      description: Public endpoint for testing. No authentication required.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Welcome to BaaS API

  # ============================================
  # Authentication Endpoints
  # ============================================
  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: registerUser
      security: []
      description: Creates a new user account with an associated organization account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      operationId: loginUser
      security: []
      description: Authenticates a user and returns JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      operationId: refreshToken
      security: []
      description: Exchanges a valid refresh token for a new access token and rotated refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    delete:
      tags:
        - Authentication
      summary: Logout user
      operationId: logoutUser
      description: Revokes the current refresh token and invalidates the session
      responses:
        '204':
          description: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================
  # Blog Endpoints
  # ============================================
  /api/v1/blogs:
    get:
      tags:
        - Blogs
      summary: List all blogs
      operationId: listBlogs
      description: Returns a paginated list of blogs for the current account
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: Blogs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Blog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Blogs
      summary: Create a blog
      operationId: createBlog
      description: Creates a new blog for the current account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogCreateRequest'
      responses:
        '201':
          description: Blog created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Blog'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/blogs/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'

    get:
      tags:
        - Blogs
      summary: Get a blog
      operationId: getBlog
      description: Returns a single blog by its public ID
      parameters:
        - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: Blog retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Blog'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Blogs
      summary: Update a blog
      operationId: updateBlog
      description: Updates an existing blog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogUpdateRequest'
      responses:
        '200':
          description: Blog updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Blog'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - Blogs
      summary: Delete a blog
      operationId: deleteBlog
      description: Soft deletes a blog (archives it)
      responses:
        '204':
          description: Blog deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # Post Endpoints
  # ============================================
  /api/v1/posts:
    get:
      tags:
        - Posts
      summary: List all posts
      operationId: listPosts
      description: Returns a paginated list of posts for the current account
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - $ref: '#/components/parameters/IncludeParam'
        - name: filter[status]
          in: query
          schema:
            type: string
            enum: [draft, published, scheduled, archived]
          description: Filter by post status
        - name: filter[blog_id]
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by blog public ID
      responses:
        '200':
          description: Posts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
