      summary: Autosave a draft
      operationId: autosaveDraft
      description: Autosaves a draft with the current content, creating a new version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftUpdateRequest'
      responses:
        '200':
          description: Draft autosaved successfully
          content:
