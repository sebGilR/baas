              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - API Keys
      summary: Update an API key
      operationId: updateApiKey
      description: Updates an API key's name or scopes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiKeyUpdateRequest'
      responses:
        '200':
          description: API key updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags:
        - API Keys
      summary: Delete an API key
      operationId: deleteApiKey
      description: Permanently deletes an API key
      responses:
        '204':
          description: API key deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/api_keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags:
        - API Keys
      summary: Revoke an API key
      operationId: revokeApiKey
      description: Revokes an API key, making it immediately unusable
      responses:
        '200':
          description: API key revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  # ============================================
  # Security Schemes
  # ============================================
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token for authentication

  # ============================================
  # Common Parameters
  # ============================================
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource public ID (UUIDv7)
      schema:
        type: string
        format: uuid
        example: 0193dc7f-1234-7890-abcd-ef1234567890

    PageParam:
      name: page
      in: query
      required: false
      description: Page number for pagination
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    PerPageParam:
      name: per_page
      in: query
      required: false
      description: Number of items per page (max 100)
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    IncludeParam:
      name: include
      in: query
      required: false
      description: Comma-separated list of relationships to include
      schema:
        type: string
        example: posts,account

  # ============================================
  # Common Responses
  # ============================================
  responses:
    Unauthorized:
      description: Unauthorized - Invalid or missing authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ============================================
  # Schemas
  # ============================================
  schemas:
    # ----------------------------------------
    # Error Response
    # ----------------------------------------
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              status:
                type: string
                example: "422"
              code:
                type: string
                example: validation_error
              title:
                type: string
                example: Validation Error
              detail:
                type: string
                example: Name can't be blank
              source:
                type: object
                properties:
                  pointer:
                    type: string
                    example: /data/attributes/name

    # ----------------------------------------
    # Pagination Meta
    # ----------------------------------------
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        total_pages:
          type: integer
          example: 10
        total_count:
          type: integer
          example: 100
        per_page:
          type: integer
          example: 20

    # ----------------------------------------
    # JSON:API Resource Identifier
    # ----------------------------------------
    ResourceIdentifier:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid

    # ----------------------------------------
    # User
    # ----------------------------------------
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: user
        attributes:
          type: object
          properties:
            email:
              type: string
              format: email
              example: user@example.com
            name:
              type: string
              example: John Doe
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    # ----------------------------------------
    # Account
    # ----------------------------------------
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: account
        attributes:
          type: object
          properties:
            name:
              type: string
              example: My Company
            slug:
              type: string
              example: my-company
            status:
              type: string
              enum: [active, inactive, suspended]
            plan:
              type: string
              enum: [free, pro, enterprise]
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    # ----------------------------------------
    # Blog
    # ----------------------------------------
    Blog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: blog
        attributes:
          type: object
          properties:
            name:
              type: string
              example: My Tech Blog
            slug:
              type: string
              example: my-tech-blog
            description:
              type: string
              example: A blog about technology
            status:
              type: string
              enum: [active, inactive, archived]
              example: active
            settings:
              type: object
              additionalProperties: true
            post_count:
              type: integer
              example: 42
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            account:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ResourceIdentifier'

    BlogCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: My Tech Blog
                slug:
                  type: string
                  example: my-tech-blog
                description:
                  type: string
                  example: A blog about technology
                settings:
                  type: object
                  additionalProperties: true
                  example:
                    theme: dark
                    language: en

    BlogUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [active, inactive, archived]
                settings:
                  type: object
                  additionalProperties: true

    # ----------------------------------------
    # Post
    # ----------------------------------------
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: post
        attributes:
          type: object
          properties:
            title:
              type: string
              example: Getting Started with Rails 8
            slug:
              type: string
              example: getting-started-with-rails-8
            content:
              type: string
              example: "# Introduction\n\nWelcome to Rails 8..."
            excerpt:
              type: string
              example: Learn how to get started with Rails 8
            status:
              type: string
              enum: [draft, published, scheduled, archived]
              example: published
            published_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            blog:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ResourceIdentifier'
            author:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ResourceIdentifier'
            tags:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/ResourceIdentifier'

    PostCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
            - relationships
          properties:
            attributes:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  example: Getting Started with Rails 8
                slug:
                  type: string
                  example: getting-started-with-rails-8
                content:
                  type: string
                  example: "# Introduction\n\nWelcome to Rails 8..."
                excerpt:
                  type: string
                  example: Learn how to get started with Rails 8
                status:
                  type: string
                  enum: [draft, published, scheduled]
                  default: draft
                published_at:
                  type: string
                  format: date-time
                  nullable: true
            relationships:
              type: object
              required:
                - blog
              properties:
                blog:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'

    PostUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              properties:
                title:
                  type: string
                slug:
                  type: string
                content:
                  type: string
                excerpt:
                  type: string
                status:
                  type: string
                  enum: [draft, published, scheduled, archived]
                published_at:
                  type: string
                  format: date-time
                  nullable: true

    # ----------------------------------------
    # Draft
    # ----------------------------------------
    Draft:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: draft
        attributes:
          type: object
          properties:
            title:
              type: string
              example: Work in Progress
            content:
              type: string
              example: "# Draft Content..."
            status:
              type: string
              enum: [active, autosaved, archived]
              example: active
            version:
              type: integer
              example: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        relationships:
          type: object
          properties:
            blog:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ResourceIdentifier'
            author:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/ResourceIdentifier'

    DraftCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
            - relationships
          properties:
            attributes:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  example: Work in Progress
                content:
                  type: string
                  example: "# Draft Content..."
            relationships:
              type: object
              required:
                - blog
              properties:
                blog:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'

    DraftUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string

    # ----------------------------------------
    # Tag
    # ----------------------------------------
    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: tag
        attributes:
          type: object
          properties:
            name:
              type: string
              example: ruby
            slug:
              type: string
              example: ruby
            description:
              type: string
              example: Posts about Ruby programming
            posts_count:
              type: integer
              example: 15
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    TagCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: ruby
                slug:
                  type: string
                  example: ruby
                description:
                  type: string
                  example: Posts about Ruby programming

    TagUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string

    # ----------------------------------------
    # Category
    # ----------------------------------------
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: category
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Technology
            slug:
              type: string
              example: technology
            description:
              type: string
              example: Technology related posts
            position:
              type: integer
              example: 1
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    CategoryCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Technology
                slug:
                  type: string
                  example: technology
                description:
                  type: string
                  example: Technology related posts
                position:
                  type: integer
                  example: 1

    CategoryUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                position:
                  type: integer

    # ----------------------------------------
    # API Key
    # ----------------------------------------
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 0193dc7f-1234-7890-abcd-ef1234567890
        type:
          type: string
          example: api_key
        attributes:
          type: object
          properties:
            name:
              type: string
              example: Production API Key
            prefix:
              type: string
              example: baas_
            scopes:
              type: array
              items:
                type: string
              example: [read, write]
            last_used_at:
              type: string
              format: date-time
              nullable: true
            expires_at:
              type: string
              format: date-time
              nullable: true
            revoked_at:
              type: string
              format: date-time
              nullable: true
            created_at:
              type: string
              format: date-time

    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            attributes:
              type: object
              properties:
                key:
                  type: string
                  description: Full API key (only shown once upon creation)
                  example: baas_sk_1234567890abcdef

    ApiKeyCreateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Production API Key
                scopes:
                  type: array
                  items:
                    type: string
                  example: [read, write]
                  description: List of permission scopes
                expires_at:
                  type: string
                  format: date-time
                  nullable: true
                  description: Optional expiration date

    ApiKeyUpdateRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              properties:
                name:
                  type: string
                scopes:
                  type: array
                  items:
                    type: string

    # ----------------------------------------
    # Authentication
    # ----------------------------------------
    RegisterRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - email
                - password
                - password_confirmation
                - name
                - account_name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: Password123!
                password_confirmation:
                  type: string
                  format: password
                  example: Password123!
                name:
                  type: string
                  example: John Doe
                account_name:
                  type: string
                  example: My Company

    LoginRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: Password123!

    RefreshTokenRequest:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - attributes
          properties:
            attributes:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    AuthenticationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: authentication
            attributes:
              type: object
              properties:
                access_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expires_in:
                  type: integer
                  description: Token expiry in seconds
                  example: 900
            relationships:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
                account:
                  type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ResourceIdentifier'
        included:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/User'
              - $ref: '#/components/schemas/Account'

    TokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              example: token
            attributes:
              type: object
              properties:
                access_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expires_in:
                  type: integer
                  description: Token expiry in seconds
                  example: 900
